name: DepositModalExample

options:
  bundleIdPrefix: dev.rhinestone
  deploymentTarget:
    # 16, not the package's 15: the content-height detent needs
    # `UISheetPresentationController.Detent.custom`, and an example that cannot
    # show the sheet sizing itself is not showing the feature.
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  RhinestoneDepositModal:
    path: ..
  # The EXAMPLE's dependency, never the package's. A real integration hands
  # `request` to whatever wallet SDK it already has; this app has none, so it
  # brings one rather than pretending signing is free.
  web3.swift:
    url: https://github.com/argentlabs/web3.swift
    from: 2.0.0

targets:
  DepositModalExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: RhinestoneDepositModal
        product: RhinestoneDepositModal
      - package: web3.swift
        product: web3.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: dev.rhinestone.depositmodal.example
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
